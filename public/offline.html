<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Social Connect</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/app.css">
<script src="assets/theme.js"></script>
</head>
<body>
<main class="auth-main offline-main">
  <div class="auth-box error-page">
    <span class="empty-icon"><svg class="icon" aria-hidden="true" focusable="false"><use href="assets/icons.svg#wifi-off"></use></svg></span>
    <h1 class="auth-title">You are offline</h1>
    <p class="auth-lead">Social Connect needs a connection to load new posts and messages. Check your Wi-Fi or mobile data, then try again.</p>
    <div class="form-actions"><a class="btn btn-primary" href="./">Try again</a></div>
  </div>
</main>
</body>
</html>
